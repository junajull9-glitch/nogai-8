<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ногай тил — 8 класс</title><style>
:root{--green:#0c6134;--bg:#f4f1ec;--line:#e6e2db;--ink:#25282a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial,Helvetica,sans-serif;color:var(--ink);height:100vh;display:flex;flex-direction:column}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #147a46;outline-offset:2px}.top{height:62px;flex:none;display:flex;align-items:center;gap:10px;padding:0 22px;background:#faf9f7;border-bottom:1px solid #e6e2dd}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap;margin-right:26px}.flower{font-size:37px;color:#b8842d}.brand strong{font: bold 26px Georgia,serif;color:#101719}.brand small{color:#555}.topnav{display:flex;align-items:stretch;height:100%;gap:4px}.top button,.bottom button{border:0;background:transparent;border-radius:8px;color:#30363a;padding:10px 12px;white-space:nowrap}.top button:hover,.bottom button:hover,.iconbtn:hover{background:#e8ebe5}.topnav button.active{color:var(--green);font-weight:700;border-bottom:3px solid var(--green);border-radius:0}.grow{flex:1}.search{display:flex;gap:5px;align-items:center;background:#f1efec;padding:0 10px;border-radius:9px}.search input{width:165px;background:transparent;border:0;outline:none;height:37px}.main{flex:1;display:flex;min-height:0;padding:8px;gap:10px}.side{width:256px;flex:none;background:#faf9f7;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 12px #332b2010}.side.right{width:262px}.side.hidden{display:none}.sidehead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);font-weight:bold;font-size:16px}.iconbtn{background:transparent;border:0;padding:6px 9px;border-radius:7px}.sidebody{overflow:auto;padding:10px 8px;flex:1}.tocitem{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:left;padding:12px 12px;border:0;background:transparent;border-radius:8px;color:#222}.tocitem:hover{background:#edf0e9}.tocitem.selected{background:#e2eade;color:#174b2c;font-weight:bold}.tocitem.sub{padding-left:29px;font-size:13px}.tocitem span:last-child{color:#7c8080}.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{width:50%;padding:16px 0;background:none;border:0;border-bottom:3px solid transparent}.tabs button.active{border-bottom-color:var(--green);color:var(--green);font-weight:700}.add{background:#e7ede3;color:#135c32;border:0;border-radius:9px;padding:13px;margin:8px;width:calc(100% - 16px);text-align:left}.item{padding:13px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}.item .content{flex:1;min-width:0;cursor:pointer}.item .content strong{display:block;line-height:1.4;font-size:13px}.item .content small{display:block;color:#777;margin-top:6px}.item .remove{border:0;background:none;color:#777}.bookmark{font-size:21px;color:#dd8841}.reader{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;background:radial-gradient(ellipse at 50% 45%,#f9f7f3,#e9e5df);border-radius:10px;padding:12px}.bookwrap{position:relative;display:flex;align-items:stretch;justify-content:center;max-width:100%;max-height:100%;filter:drop-shadow(0 5px 5px #0003)}.book{display:flex;position:relative;transform-origin:center center;transition:transform .22s;box-shadow:0 8px 19px #403d3670;border:5px solid #dad7d1;border-radius:7px;overflow:hidden;background:#fff}.book:after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(90deg,#0000000b 0%,transparent 5%,transparent 43%,#00000016 49%,#00000030 50%,#ffffff25 51%,transparent 57%,transparent 95%,#00000017 100%)}.page{position:relative;background:white;flex:none;overflow:hidden}.page img{width:100%;height:100%;display:block;object-fit:fill}.page .marker{position:absolute;z-index:2;transform:translate(-50%,-50%);border:1px solid #d9c19a;border-radius:50%;background:#fff8df;color:#88501d;width:27px;height:27px;box-shadow:0 2px 6px #0002}.page .marker.exercise{background:#e4f2e8;color:#0c6134;border-color:#b5d5bd}.page .marker:hover{transform:translate(-50%,-50%) scale(1.1)}.turning{animation:turn .32s ease}@keyframes turn{0%{opacity:.55;transform:perspective(800px) rotateY(-6deg)}100%{opacity:1;transform:perspective(800px) rotateY(0)}}.bottom{height:60px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;background:#faf9f7;margin:0 8px 8px;border-radius:10px}.bottom .sep{height:26px;width:1px;background:var(--line);margin:0 6px}.bottom .num{white-space:nowrap;min-width:100px;text-align:center;font-size:16px}.bottom input[type=range]{accent-color:var(--green);width:155px}.bottom input[type=number]{width:56px;border:1px solid #ddd;padding:5px;border-radius:5px}.bottom select{padding:9px;border:0;background:#f2f0ec;border-radius:7px}.modalback{position:fixed;inset:0;background:#0c1818a8;z-index:10;display:flex;align-items:center;justify-content:center;padding:24px}.modal{background:#fff;border-radius:15px;width:min(600px,95vw);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #0005}.modal.wide{width:min(1000px,95vw)}.modalhead{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)}.modalhead h2{font-size:20px;margin:4px 0}.modalbody{padding:24px}.modalfoot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}.primary{background:var(--green);border:0;color:#fff;padding:11px 17px;border-radius:8px}.secondary{background:#f0f1ee;border:0;padding:11px 17px;border-radius:8px}.field{width:100%;padding:10px;border:1px solid #d8d8d8;border-radius:8px}.hint{font-size:12px;color:#7d7d7d}.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#253d2e;color:#fff;padding:12px 18px;border-radius:9px;z-index:20;box-shadow:0 4px 15px #0003}.result{padding:10px 13px;border-radius:8px;background:#edf4ec;margin-top:12px}.mobiletab{display:none}@media(max-width:1200px){.side{width:210px}.side.right{width:210px}.brand{margin-right:4px}.top{padding:0 10px;gap:3px}.top button{padding:9px 7px}.search input{width:100px}}@media(max-width:900px){.topnav button .txt,.top .hide-sm{display:none}.side{position:absolute;top:69px;bottom:70px;z-index:5;box-shadow:0 7px 30px #0003}.side.right{right:8px}.reader{padding:4px}.bottom{gap:1px;padding:0 7px}.bottom input[type=range]{width:80px}.bottom .num{min-width:65px;font-size:12px}.bottom .hide-sm{display:none}}
</style></head><body>
<header class="top"><div class="brand"><span class="flower">✺</span><strong>Ногай тил</strong><small>8 класс</small></div><nav class="topnav"><button class="active" id="readTab">▣ <span class="txt">Читать</span></button><button id="tocToggle">☷ <span class="txt">Оглавление</span></button><button id="bookmarkToggle">♧ <span class="txt">Закладки</span></button><button id="notesToggle">▤ <span class="txt">Заметки</span></button></nav><div class="grow"></div><div class="search">⌕ <input id="searchInput" placeholder="Поиск по учебнику" aria-label="Поиск по учебнику"><button id="searchGo" aria-label="Искать">↵</button></div><button id="settingsBtn">⚙ <span class="hide-sm">Настройки</span></button><button id="fullscreenBtn">⛶ <span class="hide-sm">Полный экран</span></button></header>
<div class="main"><aside class="side" id="leftSide"><div class="sidehead">Оглавление <button class="iconbtn" id="closeLeft">❮</button></div><div class="sidebody" id="toc"></div></aside><main class="reader" id="reader"><div class="bookwrap"><div class="book" id="book"><div class="page" id="pageL"><img alt="Левая страница учебника"><div class="markers"></div></div><div class="page" id="pageR"><img alt="Правая страница учебника"><div class="markers"></div></div></div></div></main><aside class="side right" id="rightSide"><div class="tabs"><button class="active" id="tabBookmarks">Закладки</button><button id="tabNotes">Заметки</button></div><div class="sidebody" id="rightContent"></div></aside></div>
<footer class="bottom"><button id="first" title="В начало">Ⅰ◀</button><button id="prev" title="Предыдущий разворот">❮</button><span class="num" id="pageNum">4 — 5 / 154</span><button id="next" title="Следующий разворот">❯</button><button id="last" title="В конец">▶Ⅰ</button><div class="grow"></div><select id="viewMode"><option value="spread">▣ Разворот</option><option value="single">▯ Одна страница</option></select><span class="sep"></span><span>⌕</span><input id="zoom" type="range" min="70" max="180" step="5" value="100" aria-label="Масштаб"><span id="zoomLabel">100%</span><span class="sep"></span><button id="fitBtn">По ширине</button><button id="moreBtn" title="Дополнительно">⋯</button></footer>
<div id="modalHost"></div><script>
const N=154;const $=id=>document.getElementById(id);const store=(key,val)=>localStorage.setItem('nogay_'+key,JSON.stringify(val));const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem('nogay_'+key))??fallback}catch{return fallback}};
let current=load('page',4),zoom=100,mode='spread',rightTab='bookmarks',notes=load('notes',[]),bookmarks=load('bookmarks',[]),searchText=null,annotationMode=false,activeModal=null;
const sections=[['Кирис соьз',4],['6 — 7 классларда окылганларды кайтаралав',5],['§1 Фонетика эм графика',5,1],['§2 Соьз биригуьви эм йыйма',13,1],['§3 Йыймадынъ туьзилиси',17,1],['Синтаксис эм пунктуация',13],['Кабатсыз йыйма',28],['§7 Подлежащее',35,1],['§8 Кабатсыз сказуемое',38,1],['§9 Кабатлы сказуемое',40,1],['Остальные страницы',41]];
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function imgSrc(n){return 'pages/'+String(n).padStart(3,'0')+'.webp'}
function setPage(n){n=Math.min(N,Math.max(1,Number(n)||1));if(mode==='spread'&&n%2===1)n=Math.max(1,n-1);current=n;store('page',current);render()}
function render(){const reader=$('reader'),book=$('book');const spread=mode==='spread';const first=current;const second=spread?current+1:0;const availableW=Math.max(180,reader.clientWidth-28),availableH=Math.max(180,reader.clientHeight-28);const ratio=481.89/609.45;const baseH=Math.min(availableH,availableW/(ratio*(spread?2:1)));const h=baseH*zoom/100,w=h*ratio;book.style.width=(w*(spread?2:1))+'px';book.style.height=h+'px';book.style.flexShrink='0';book.classList.remove('turning');void book.offsetWidth;book.classList.add('turning');for(const [id,num] of [['pageL',first],['pageR',second]]){const el=$(id);el.style.display=num&&num<=N?'block':'none';el.style.width=w+'px';el.style.height=h+'px';if(num&&num<=N){el.querySelector('img').src=imgSrc(num);el.querySelector('img').alt='Страница '+num;renderMarkers(el,num)}}$('pageNum').textContent=spread?`${first} — ${Math.min(second,N)} / ${N}`:`${first} / ${N}`;$('zoomLabel').textContent=zoom+'%';$('zoom').value=zoom;document.querySelectorAll('.tocitem').forEach(el=>el.classList.toggle('selected',Number(el.dataset.page)===current));}
function renderMarkers(el,page){const box=el.querySelector('.markers');box.innerHTML='';notes.filter(n=>n.page===page&&n.x!=null).forEach(n=>{const b=document.createElement('button');b.className='marker';b.style.left=n.x+'%';b.style.top=n.y+'%';b.textContent='✎';b.title='Заметка: '+n.text;b.onclick=()=>editNote(n.id);box.appendChild(b)});if(page===5){const b=document.createElement('button');b.className='marker exercise';b.style.left='8%';b.style.top='29%';b.textContent='✦';b.title='Открыть демонстрационное задание';b.onclick=()=>openExercise();box.appendChild(b)}if(page===32){const b=document.createElement('button');b.className='marker exercise';b.style.left='7%';b.style.top='42%';b.textContent='♫';b.title='Аудиозадание: файл пока не подключён';b.onclick=()=>openAudio();box.appendChild(b)}}
function renderTOC(){const toc=$('toc');toc.innerHTML='';sections.forEach(([name,p,sub])=>{const b=document.createElement('button');b.className='tocitem'+(sub?' sub':'');b.dataset.page=p;b.innerHTML=`<span>${safe(name)}</span><span>${p}</span>`;b.onclick=()=>setPage(p);toc.appendChild(b)});}
function renderRight(){const root=$('rightContent');$('tabBookmarks').classList.toggle('active',rightTab==='bookmarks');$('tabNotes').classList.toggle('active',rightTab==='notes');root.innerHTML='';const add=document.createElement('button');add.className='add';add.textContent=rightTab==='bookmarks'?'＋  Добавить закладку':'＋  Добавить заметку';add.onclick=()=>rightTab==='bookmarks'?addBookmark():newNote();root.appendChild(add);if(rightTab==='bookmarks'){if(!bookmarks.length)root.insertAdjacentHTML('beforeend','<p class="hint" style="padding:12px">Закладок пока нет. Добавьте первую.</p>');bookmarks.slice().sort((a,b)=>a-b).forEach(p=>{const el=document.createElement('div');el.className='item';el.innerHTML=`<span class="bookmark">▮</span><div class="content"><strong>Страница ${p}</strong><small>Перейти к странице</small></div><button class="remove" title="Удалить">✕</button>`;el.querySelector('.content').onclick=()=>setPage(p);el.querySelector('.remove').onclick=()=>{bookmarks=bookmarks.filter(x=>x!==p);store('bookmarks',bookmarks);renderRight()};root.appendChild(el)})}else{if(!notes.length)root.insertAdjacentHTML('beforeend','<p class="hint" style="padding:12px">Заметок пока нет. Можно добавить заметку к странице или нажать на нужное место на странице.</p>');notes.slice().reverse().forEach(n=>{const el=document.createElement('div');el.className='item';el.innerHTML=`<span style="color:#17683b">✎</span><div class="content"><strong>${safe(n.text)}</strong><small>Страница ${n.page}${n.x!=null?' · отметка на странице':''}</small></div><button class="remove" title="Удалить">✕</button>`;el.querySelector('.content').onclick=()=>{setPage(n.page);editNote(n.id)};el.querySelector('.remove').onclick=()=>{notes=notes.filter(x=>x.id!==n.id);store('notes',notes);renderRight();render()};root.appendChild(el)})}}
function addBookmark(){if(!bookmarks.includes(current)){bookmarks.push(current);store('bookmarks',bookmarks)}renderRight();toast('Закладка добавлена')}
function newNote(page=current,x=null,y=null){openModal('Новая заметка',`<p class="hint">Страница ${page}${x!==null?' · привязка к точке на странице':''}</p><textarea class="field" id="noteText" rows="5" placeholder="Введите текст заметки"></textarea>`,[{label:'Отмена',close:true},{label:'Сохранить',primary:true,fn:()=>{const val=$('noteText').value.trim();if(!val)return false;notes.push({id:Date.now()+Math.random(),page,x,y,text:val});store('notes',notes);renderRight();render();return true}}])}
function editNote(id){const n=notes.find(x=>x.id===id);if(!n)return;openModal('Заметка · страница '+n.page,`<textarea class="field" id="noteText" rows="5">${safe(n.text)}</textarea>`,[{label:'Закрыть',close:true},{label:'Сохранить',primary:true,fn:()=>{n.text=$('noteText').value.trim();store('notes',notes);renderRight();render();return true}}])}
function openModal(title,body,buttons=[],wide=false){const host=$('modalHost');host.innerHTML=`<div class="modalback"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="modalhead"><div><small style="color:#888">Ногай тил · 8 класс</small><h2>${safe(title)}</h2></div><button class="iconbtn" id="modalClose" aria-label="Закрыть">✕</button></div><div class="modalbody">${body}</div><div class="modalfoot" id="modalActions"></div></div></div>`;host.querySelector('#modalClose').onclick=closeModal;host.querySelector('.modalback').onclick=e=>{if(e.target.classList.contains('modalback'))closeModal()};buttons.forEach(b=>{const el=document.createElement('button');el.className=b.primary?'primary':'secondary';el.textContent=b.label;el.onclick=()=>{if(b.fn){if(b.fn()!==false)closeModal()}else if(b.close)closeModal()};$('modalActions').appendChild(el)});activeModal=true}
function closeModal(){$('modalHost').innerHTML='';activeModal=false}
function openExercise(){openModal('Упражнение 1 · страница 5',`<p class="hint">Демонстрация интерактивного задания. Формулировки и проверку ответов необходимо согласовать отдельно.</p><h3>Выберите вариант ответа</h3><p>Это пример работы модального теста поверх учебника.</p><label style="display:block;margin:12px 0"><input type="radio" name="ex" value="1"> Вариант 1</label><label style="display:block;margin:12px 0"><input type="radio" name="ex" value="2"> Вариант 2</label><label style="display:block;margin:12px 0"><input type="radio" name="ex" value="3"> Вариант 3</label><div id="exerciseResult"></div>`,[{label:'Закрыть',close:true},{label:'Проверить',primary:true,fn:()=>{const v=document.querySelector('input[name=ex]:checked');$('exerciseResult').innerHTML=`<div class="result">${v?'Ответ выбран. Проверка учебного содержания пока не настроена.':'Сначала выберите ответ.'}</div>`;return false}}])}
function openAudio(){openModal('Аудиозадание · страница 32','<p>На странице учебника предусмотрено задание с прослушиванием.</p><p class="hint">Аудиофайл не входит в загруженный PDF. После добавления звукового файла здесь появится управление воспроизведением.</p>',[{label:'Понятно',close:true}])}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}
$('prev').onclick=()=>setPage(current-(mode==='spread'?2:1));$('next').onclick=()=>setPage(current+(mode==='spread'?2:1));$('first').onclick=()=>setPage(1);$('last').onclick=()=>setPage(N);$('zoom').oninput=e=>{zoom=+e.target.value;render()};$('fitBtn').onclick=()=>{zoom=100;render()};$('viewMode').onchange=e=>{mode=e.target.value;setPage(current)};
$('tocToggle').onclick=()=>$('leftSide').classList.toggle('hidden');$('closeLeft').onclick=()=>$('leftSide').classList.add('hidden');$('bookmarkToggle').onclick=()=>{rightTab='bookmarks';$('rightSide').classList.remove('hidden');renderRight()};$('notesToggle').onclick=()=>{rightTab='notes';$('rightSide').classList.remove('hidden');renderRight()};$('tabBookmarks').onclick=()=>{rightTab='bookmarks';renderRight()};$('tabNotes').onclick=()=>{rightTab='notes';renderRight()};
$('settingsBtn').onclick=()=>openModal('Настройки',`<p>Параметры отображения учебника</p><label><input type="checkbox" id="annotationCheck" ${annotationMode?'checked':''}> Режим добавления заметки нажатием на страницу</label><p class="hint">В этом режиме нажмите на нужное место страницы, чтобы прикрепить заметку.</p>`,[{label:'Готово',primary:true,fn:()=>{annotationMode=$('annotationCheck').checked;toast(annotationMode?'Нажмите на страницу для добавления заметки':'Режим заметок отключён');return true}}]);
for(const id of ['pageL','pageR'])$(id).addEventListener('click',e=>{if(!annotationMode||e.target.closest('button'))return;const rect=e.currentTarget.getBoundingClientRect();const x=(e.clientX-rect.left)/rect.width*100,y=(e.clientY-rect.top)/rect.height*100;newNote(id==='pageL'?current:current+1,Math.round(x*10)/10,Math.round(y*10)/10)});
$('fullscreenBtn').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};$('moreBtn').onclick=()=>openModal('Дополнительно',`<p>Для добавления заметки в конкретное место страницы откройте <b>Настройки</b> и включите соответствующий режим.</p><p>Закладки и заметки сохраняются в браузере на этом устройстве.</p><p>Клавиши ← и → перелистывают страницы.</p>`,[{label:'Закрыть',close:true}]);
async function search(){const q=$('searchInput').value.trim().toLocaleLowerCase();if(!q)return;openModal('Поиск по учебнику','<p>Ищем совпадения…</p>',[{label:'Закрыть',close:true}],true);try{if(!searchText){const r=await fetch('search.json');if(!r.ok)throw Error('Файл поиска не найден');searchText=await r.json()}const found=[];searchText.forEach((t,i)=>{const at=t.toLocaleLowerCase().indexOf(q);if(at>=0)found.push({page:i+1,snip:t.slice(Math.max(0,at-50),Math.min(t.length,at+q.length+90)).replace(/\s+/g,' ')})});const body=$('modalHost').querySelector('.modalbody');body.innerHTML=`<p>Найдено страниц: <b>${found.length}</b></p>`+(found.length?found.slice(0,100).map(x=>`<div class="item"><div class="content" data-goto="${x.page}"><strong>Страница ${x.page}</strong><small>${safe(x.snip)}</small></div></div>`).join(''):'<p>Совпадений не найдено.</p>');body.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{setPage(+el.dataset.goto);closeModal()})}catch(e){$('modalHost').querySelector('.modalbody').textContent='Не удалось загрузить поиск. Откройте читалку через локальный сервер, как указано в инструкции.'}}
$('searchGo').onclick=search;$('searchInput').onkeydown=e=>{if(e.key==='Enter')search()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&activeModal)closeModal();if(activeModal||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')setPage(current+(mode==='spread'?2:1));if(e.key==='ArrowLeft')setPage(current-(mode==='spread'?2:1))});window.addEventListener('resize',render);renderTOC();renderRight();render();
</script><script>window.addEventListener('load',()=>{let a=document.getElementById('pageNum').textContent;document.getElementById('next').click();let b=document.getElementById('pageNum').textContent;document.body.setAttribute('data-test',a+' -> '+b)})</script></body></html>
