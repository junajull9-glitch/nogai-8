/* StPageFlip: static book frame and shadow; only page leaves are animated. */
/* Cover is a single right-hand page; there is no left leaf or visible central gutter. */
.bookwrap.at-cover::after{display:none!important}

.bookwrap{filter:none!important;overflow:visible;position:relative}
.bookwrap::before{content:"";position:absolute;inset:0;box-shadow:0 16px 26px rgba(48,39,29,.33),0 4px 9px rgba(48,39,29,.19);border-radius:4px;pointer-events:none;z-index:0}
/* Permanent spine shading: anchored to the book frame, never to an animated leaf. */
.bookwrap::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:36px;transform:translateX(-50%);background:linear-gradient(90deg,transparent 0%,rgba(39,30,22,.055) 22%,rgba(25,20,15,.20) 46%,rgba(25,20,15,.22) 50%,rgba(255,255,255,.08) 58%,transparent 100%);pointer-events:none;z-index:6}
.bookwrap:has(.stf__wrapper.--portrait)::after{display:none}

.book{display:block!important;min-width:0!important;border:0!important;box-shadow:none!important;border-radius:0!important;overflow:visible!important;isolation:auto!important;background:transparent!important;transition:none!important;transform:none!important;filter:none!important}
.book::after{display:none!important}
.flip-page{background:#fff;overflow:hidden;position:relative}
.flip-page img{width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}
.flip-page .markers{position:absolute;inset:0;pointer-events:none}
.flip-page .marker{pointer-events:auto;position:absolute;z-index:3;transform:translate(-50%,-50%);border:1px solid #d9c19a;border-radius:50%;background:#fff8df;color:#88501d;width:27px;height:27px;box-shadow:0 2px 6px #0002}.flip-page .marker.exercise{background:#e4f2e8;color:#0c6134;border-color:#b5d5bd}
.library-error{padding:30px;background:#fff;border:1px solid #c88;max-width:440px;line-height:1.6}

/* v1.8: keep the page-turn viewport fixed and the paper fully opaque. */
.reader{overflow:hidden!important;scrollbar-width:none!important}
.reader::-webkit-scrollbar{display:none!important}
.bookwrap{flex:none!important;overflow:visible!important;transform:none!important}
.bookwrap::before{z-index:0!important}
.bookwrap::after{z-index:3!important}
.book{overflow:visible!important}
.flip-page{background-color:#fff;opacity:1}
.flip-page{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-page img{opacity:1!important;mix-blend-mode:normal!important;filter:none!important;background:#fff!important}
.stf__item .flip-page{background:#fff!important}

/* v1.11: gutter shading is painted ON the paper, not above moving leaves. */
.bookwrap::after{display:none!important}
.bookwrap::before{z-index:0!important}
.bookwrap>.book{position:relative!important;z-index:1!important}
.flip-page::after{content:"";position:absolute;top:0;bottom:0;width:38px;pointer-events:none;z-index:2;opacity:1}
.flip-page.gutter-left::after{left:0;background:linear-gradient(90deg,rgba(38,31,25,.24) 0%,rgba(38,31,25,.11) 15%,rgba(38,31,25,.035) 55%,transparent 100%)}
.flip-page.gutter-right::after{right:0;background:linear-gradient(270deg,rgba(38,31,25,.24) 0%,rgba(38,31,25,.11) 15%,rgba(38,31,25,.035) 55%,transparent 100%)}
/* v1.12: gutter belongs to the fixed spread, NOT to the page edges. */
.flip-page::after,.flip-page.gutter-left::after,.flip-page.gutter-right::after{content:none!important;display:none!important}
.bookwrap::after{display:block!important;content:"";position:absolute;top:0;bottom:0;left:50%;width:44px;transform:translateX(-50%);pointer-events:none;z-index:5!important;background:linear-gradient(90deg,transparent 0%,rgba(35,28,22,.025) 12%,rgba(35,28,22,.09) 32%,rgba(35,28,22,.20) 47%,rgba(35,28,22,.23) 50%,rgba(35,28,22,.10) 56%,rgba(255,255,255,.10) 76%,transparent 100%)}
/* While a leaf crosses the gutter, the engine draws the moving shadow. */
.bookwrap.is-flipping::after{opacity:0}
.bookwrap:has(.stf__wrapper.--portrait)::after{display:none!important}

/* The actual page area may exceed the viewport when zoomed.
   Clamping the wrapper to 100% previously disabled all panning. */
#bookwrap{max-width:none!important;max-height:none!important}
/* v1.20: zoomed spread panning, independent of page-flip gestures. */
#reader{position:relative;overflow:hidden!important}
#bookwrap{transform:translate3d(var(--pan-x,0px),var(--pan-y,0px),0)!important;will-change:transform}
#panSurface{position:absolute;inset:0;z-index:7;display:none;cursor:grab;touch-action:none;background:transparent;user-select:none;-webkit-user-select:none}
#reader.pan-enabled #panSurface{display:block}
#reader.pan-enabled #panSurface:active{cursor:grabbing}
/* Keep the drag hit-area inside the reading viewport. */
#reader{position:relative!important}
#reader.pan-enabled{cursor:grab}
#reader.pan-enabled #panSurface{inset:0;pointer-events:auto}
#bookwrap{transition:none!important}

/* v1.22: page navigation lives outside the paper. */
.reader{position:relative!important}
.edge-turn{position:absolute;top:50%;transform:translateY(-50%);z-index:30;border:0;background:transparent!important;box-shadow:none!important;color:#4c504f;font-size:76px;line-height:1;cursor:pointer;padding:14px 7px;opacity:.66;transition:opacity .15s;user-select:none}
.edge-turn:hover,.edge-turn:focus-visible{opacity:1;color:#0c6134;outline-offset:3px}
.edge-turn.left{left:5px}.edge-turn.right{right:5px}
.edge-turn:disabled{opacity:.18;cursor:default}

/* v1.26: spine shadow is clipped to the visible reader, not the zoomed
   book host (which StPageFlip can reposition and clip independently). */
#bookwrap::after{display:none!important}
#reader::after{content:"";position:absolute;left:var(--spine-x,50%);top:var(--spine-top,0px);height:var(--spine-height,0px);width:44px;transform:translateX(-50%);pointer-events:none;z-index:6;background:linear-gradient(90deg,transparent 0%,rgba(35,28,22,.025) 12%,rgba(35,28,22,.09) 32%,rgba(35,28,22,.20) 47%,rgba(35,28,22,.23) 50%,rgba(35,28,22,.10) 56%,rgba(255,255,255,.10) 76%,transparent 100%);opacity:1}
#reader.spine-hidden::after{opacity:0}
/* Visual bookmarks: tabs are fixed to the reading viewport, never to the zoomed paper. */
#bookmarkRail{position:absolute;right:31px;top:12%;bottom:12%;z-index:35;display:flex;flex-direction:column;align-items:flex-end;gap:5px;max-height:76%;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;padding:3px 0 3px 4px;pointer-events:none}
.bookmark-tab{pointer-events:auto;flex:none;display:flex;align-items:center;justify-content:center;min-width:34px;height:27px;padding:0 6px;border:0;border-radius:5px 0 0 5px;background:#e18a41;color:#fff;font-weight:700;font-size:11px;box-shadow:0 1px 5px #0004;cursor:pointer;opacity:.87;transition:transform .12s,opacity .12s}
.bookmark-tab:hover,.bookmark-tab:focus-visible{transform:translateX(-5px);opacity:1}
.bookmark-tab.is-current{background:#0c6134;opacity:1}
.flip-page .page-bookmark-ribbon,.static-fallback-page .page-bookmark-ribbon{position:absolute;right:9px;top:0;z-index:8;pointer-events:auto;width:23px;height:35px;border:0;background:#e18a41;color:white;box-shadow:0 2px 4px #0003;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);cursor:pointer;font-size:14px;padding:0 0 8px}
.flip-page .page-bookmark-ribbon:hover,.static-fallback-page .page-bookmark-ribbon:hover{background:#b76524}
@media(max-width:750px){#bookmarkRail{right:24px}.bookmark-tab{min-width:28px;height:24px;font-size:10px}}

/* Notes: page-relative translucent highlights, independent of zoom and panning. */
.note-highlight-layer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
/* Blend the entire highlight layer against the underlying printed page, not each overlapping stroke against other strokes. */
.note-highlight-layer{mix-blend-mode:multiply;isolation:auto}
.note-highlight{mix-blend-mode:normal!important}
.note-highlight{position:absolute;pointer-events:auto;cursor:pointer;border-radius:2px;mix-blend-mode:multiply}
.note-highlight:hover{outline:1px solid #17683b}
#annotationSurface{position:absolute;inset:0;z-index:40;display:none;touch-action:none;cursor:crosshair;user-select:none}
#reader.annotation-active #annotationSurface{display:block}
#annotationToolbar{position:absolute;z-index:41;top:10px;left:50%;transform:translateX(-50%);background:#fff;box-shadow:0 3px 14px #0003;border:1px solid #ddd;border-radius:9px;padding:8px;display:none;align-items:center;gap:8px;white-space:nowrap;font-size:12px}

.note-draft{position:absolute;pointer-events:none;z-index:39;border-radius:2px;mix-blend-mode:multiply}

/* Audio markers: placed just outside the blue rule box, never over its text. */
.audio-rule-button{position:absolute;left:92.5%;top:43.5%;transform:translate(-50%,-50%);width:7.5%;aspect-ratio:1;min-width:22px;max-width:43px;display:flex;align-items:center;justify-content:center;border:2px solid #0c6134;border-radius:50%;background:#fff;color:#0c6134;box-shadow:0 2px 7px #0003;cursor:pointer;z-index:12;padding:3px;pointer-events:auto}

.audio-rule-button svg{width:80%;height:80%;display:block}
/* Two audio controls on printed page 32, in the blank right margin. */
.audio-32-button{position:absolute;left:89%;transform:translate(-50%,-50%);width:7%;aspect-ratio:1;min-width:22px;max-width:40px;border:2px solid #0c6134;border-radius:50%;background:#fff;color:#0c6134;box-shadow:0 2px 7px #0003;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:12;padding:4px;pointer-events:auto}

.audio-speed select{padding:7px;border:1px solid #d5dcd5;border-radius:6px;background:white}

/* Persistent audio player in the bottom toolbar. */
.bottom{gap:6px;padding-left:10px;padding-right:10px}
.audio-dock{display:none;align-items:center;gap:7px;min-width:0;max-width:390px;border-left:1px solid var(--line);padding-left:9px}

(function initAnnotations(){const surface=$('annotationSurface');
 const tool=(id,value)=>$(id).onclick=()=>{noteTool=value;$('noteMarkerTool').classList.toggle('chosen',value==='marker');$('noteAreaTool').classList.toggle('chosen',value==='area')};tool('noteMarkerTool','marker');tool('noteAreaTool','area');

 surface.addEventListener('pointermove',e=>{const d=noteDrag;if(!d||d.id!==e.pointerId)return;const p=notePoint(e.clientX,e.clientY,d.rect);if(noteTool==='area'){d.rects=[makeNoteRect(d.start,p)]}else{const previous=d.last;const thickness=2.5;const r=makeNoteRect(previous,p);r.y=Math.max(0,Math.min(previous.y,p.y)-thickness/2);r.h=Math.min(100-r.y,Math.max(thickness,Math.abs(p.y-previous.y)+thickness));r.w=Math.max(r.w,.5);d.rects.push(r);if(d.rects.length>600)d.rects=d.rects.filter((_,i)=>i%2===0)}d.last=p;showNoteDraft()});
 function finish(e){const d=noteDrag;if(!d||d.id!==e.pointerId)return;noteDrag=null;document.querySelectorAll('.note-draft').forEach(el=>el.remove());if(e.type==='pointercancel')return;let rects=d.rects.filter(r=>r.w>.1&&r.h>.1);if(!rects.length){const p=d.start;rects=[{x:p.x,y:Math.max(0,p.y-1.25),w:Math.min(12,100-p.x),h:2.5}]};if(noteTool==='marker'&&rects.length>1){const merged=[];for(const r of rects){const prev=merged[merged.length-1];if(prev&&Math.abs(prev.y-r.y)<1.1&&Math.abs(prev.h-r.h)<1.1){const right=Math.max(prev.x+prev.w,r.x+r.w);prev.x=Math.min(prev.x,r.x);prev.w=right-prev.x}else merged.push({...r})}rects=merged}stopAnnotation();newHighlightNote(d.page,rects,noteInk)}

})();
function newHighlightNote(page,rects,color){openModal('Заметка к выделению',`<p class="hint">Страница ${page} · выделенный фрагмент</p><textarea class="field" id="noteText" rows="5" placeholder="Введите комментарий к выделению"></textarea>`,[{label:'Отмена',close:true},{label:'Сохранить',primary:true,fn:()=>{const val=$('noteText').value.trim();if(!val)return false;notes.push({id:Date.now()+Math.random(),page,rects,color,text:val});store('notes',notes);renderRight();renderMarkersAll();return true}}])}

// Direct page navigation: Enter confirms, Escape cancels, blur confirms valid values.
const pageInput=$('pageInput');

async function search(){const q=$('searchInput').value.trim().toLocaleLowerCase();if(!q)return;openModal('Поиск по учебнику','<p>Ищем совпадения…</p>',[{label:'Закрыть',close:true}],true);try{if(!searchText){const r=await fetch('search.json');if(!r.ok)throw Error('Файл поиска не найден');searchText=await r.json()}const found=[];searchText.forEach((t,i)=>{const at=t.toLocaleLowerCase().indexOf(q);if(at>=0)found.push({page:i+1,snip:t.slice(Math.max(0,at-50),Math.min(t.length,at+q.length+90)).replace(/\s+/g,' ')})});const body=$('modalHost').querySelector('.modalbody');body.innerHTML=`<p>Найдено страниц: <b>${found.length}</b></p>`+(found.length?found.slice(0,100).map(x=>`<div class="item"><div class="content" data-goto="${x.page}"><strong>Страница ${x.page}</strong><small>${safe(x.snip)}</small></div></div>`).join(''):'<p>Совпадений не найдено.</p>');body.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{setPage(+el.dataset.goto);closeModal()})}catch(e){$('modalHost').querySelector('.modalbody').textContent='Не удалось загрузить поиск. Откройте читалку через локальный сервер, как указано в инструкции.'}}
